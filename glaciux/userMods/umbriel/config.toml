[output.HDMI-A-1]
mode = "2560x1440@143.999000"
position = [-1536, -240]
hdr = "on"
sdr_white = 300
[general]
autostart = ["noctalia"]
xwayland = true
[appearance]
prefer_no_csd = true
border_width = 4
corner_radius = 0
[layout]
gap = 0
[input.keyboard]
layout = "us,us"
variant = "colemak,euro"
options = "grp:caps_toggle"
[input.cursor]
hide_when_typing = true
hide_timeout_ms = 4000
[input.focus]
follows_mouse = true
[keybinds]
"Mod+C" = { action = "window-close", repeat = false }
"Mod+F" = "window-toggle-maximize"
"Mod+O" = "overview-toggle"
"Mod+Shift+O" = "workspace-set-layout:toggle"
"Mod+V" = "window-toggle-floating"
"Mod+WheelLeft" = "window-focus-left"
"Mod+WheelRight" = "window-focus-right"
"Mod+H" = "window-focus-left"
"Mod+L" = "window-focus-right"
"Mod+J" = "window-focus-down"
"Mod+K" = "window-focus-up"
"Mod+Alt+H" = "window-consume-left"
"Mod+Alt+J" = "window-move-down"
"Mod+Alt+K" = "window-move-up"
"Mod+Alt+L" = "window-expel-right"
"Mod+Comma" = "window-cycle-width"
"Escape" = "submap:reset"
"Mod+Space" = "spawn:noctalia msg panel-toggle launcher"
"Mod+S" = "spawn:noctalia msg panel-toggle control-center"
"Mod+Shift+G" = "spawn:noctalia msg session lock"
"Mod+Shift+Alt+G" = "spawn:noctalia msg session lock"
"XF86AudioRaiseVolume" = "spawn:noctalia msg volume-up"
"XF86AudioLowerVolume" = "spawn:noctalia msg volume-down"
"XF86AudioMicMute" = "spawn:noctalia msg mic-mute"
"XF86AudioMute" = "spawn:noctalia msg volume-mute"
"XF86AudioNext" = "spawn:noctalia msg media next"
"XF86AudioPlay" = "spawn:noctalia msg media toggle"
"XF86AudioPrev" = "spawn:noctalia msg media previous"
"XF86MonBrightnessUp" = "spawn:noctalia msg brightness-up"
"XF86MonBrightnessDown" = "spawn:noctalia msg brightness-down"
