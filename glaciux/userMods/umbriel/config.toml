[include.optional]
files = ["noctalia.toml"]
[output.eDP-1]
mode = "1920x1200@60.003"
position = [0, 0]
scale = 1.25
bit_depth = 10
vrr = "always"
[output.HDMI-A-1]
mode = "2560x1440@143.999000"
position = [-512, -1440]
hdr = "auto"
bit_depth = 10
vrr = "fullscreen"
[general]
autostart = ["foot"]
xwayland = true
[appearance]
prefer_no_csd = true
border_width = 4
corner_radius = 0
[[window_rule]]
blur = true
blur_optimized = false
[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd)$"
blur = true
blur_ignore_alpha = 0.6
blur_optimized = false
[layout]
gap = 0
[layout.scrolling]
default_extent_fraction = 0.5
[workspaces]
empty_above = true
[input.touchpad]
natural_scroll = true
[input.keyboard]
layout = "us,us"
variant = "colemak,euro"
options = "grp:caps_toggle"
[input.cursor]
follows_focus = true
hide_when_typing = true
hide_timeout_ms = 4000
[input.focus]
follows_mouse = true
[input.drag_edge_scroll]
enabled = true
[keybinds]
"Mod+Shift+Slash" = "cheatsheet-toggle"
"Mod+C" = { action = "window-close", repeat = false }
"Mod+F" = "window-toggle-maximize"
"Mod+Shift+F" = "window-toggle-fullscreen"
"Mod+O" = "overview-toggle"
"Mod+Shift+O" = "workspace-set-layout toggle"
"Mod+V" = "window-toggle-floating"
"Mod+WheelLeft" = "window-focus-left"
"Mod+WheelRight" = "window-focus-right"
"Mod+H" = "window-focus-left"
"Mod+L" = "window-focus-right"
"Mod+J" = "window-focus-or-workspace-down"
"Mod+K" = "window-focus-or-workspace-up"
"Mod+Shift+J" = "output-focus-down"
"Mod+Shift+K" = "output-focus-up"
"Mod+Alt+H" = "window-consume-or-expel-left"
"Mod+Alt+J" = "window-move-or-workspace-down"
"Mod+Alt+K" = "window-move-or-workspace-up"
"Mod+Alt+L" = "window-consume-or-expel-right"
"Mod+WheelDown" = {action = "workspace-next", repeat = false}
"Mod+WheelUp" = {action = "workspace-previous", repeat = false}
"Mod+Alt+Shift+J" = "window-move-to-output-down"
"Mod+Alt+Shift+K" = "window-move-to-output-up"
"Mod+Comma" = "window-cycle-primary-extent"
"Mod+Period" = "window-cycle-secondary-extent"
"Mod+Slash" = "window-set-secondary-extent 1"
"Escape" = "submap reset"
"Mod+Tab" = "spawn noctalia msg window-switcher"
"Mod+Space" = "spawn noctalia msg panel-toggle launcher"
"Mod+S" = "spawn noctalia msg panel-toggle control-center"
"Mod+Shift+G" = "spawn noctalia msg session lock"
"Mod+Alt+G" = "spawn noctalia msg session logout"
"Print" = "spawn noctalia msg screenshot-region"
"Alt+Print" = "spawn noctalia msg screenshot-fullscreen pick"
"XF86AudioRaiseVolume" = { action = "spawn noctalia msg volume-up", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn noctalia msg volume-down", allow_when_locked = true }
"XF86AudioMicMute" = { action = "spawn noctalia msg mic-mute", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn noctalia msg volume-mute", allow_when_locked = true }
"XF86AudioNext" = { action = "spawn noctalia msg media next", allow_when_locked = true }
"XF86AudioPlay" = { action = "spawn noctalia msg media toggle", allow_when_locked = true }
"XF86AudioPrev" = { action = "spawn noctalia msg media previous", allow_when_locked = true }
"XF86MonBrightnessUp" = { action = "spawn noctalia msg brightness-up", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn noctalia msg brightness-down", allow_when_locked = true }
