[audio]
enable_sounds = true

[bar]
order = ["widgets"]

[bar.widgets]
background_opacity = 1
border_width = 0.0
capsule = true
capsule_opacity = 0.0
capsule_padding = 10.0
capsule_radius = 0
capsule_thickness = 1
center = ["bar", "clock", "bar_2"]
contact_shadow = false
end = [
  "nix-monitor",
  "tray",
  "notifications",
  "clipboard",
  "brightness",
  "volume",
  "bluetooth",
  "network",
  "battery",
]
font_family = "Iosevka NF"
font_weight = 400
margin_edge = 0
margin_ends = 0
panel_overlap = 0
position = "top"
radius = 0
scale = 1
shadow = false
start = ["cpu", "ram", "widget", "weather"]
thickness = 30
widget_spacing = 15

[brightness]
enable_ddcutil = true

[control_center]
sidebar = "full"
sidebar_section = "none"
width = 1000

[control_center.calendar]
show_events_card = false

[desktop_widgets]
enabled = false

[idle]
behavior_order = ["lock", "screen-off", "lock-and-suspend"]

[idle.behavior.lock]
action = "lock"
enabled = true
timeout = 600

[idle.behavior.lock-and-suspend]
action = "lock_and_suspend"
enabled = true
timeout = 900

[idle.behavior.screen-off]
action = "screen_off"
enabled = true
timeout = 660

[location]
auto_locate = true

[lockscreen]
blur_intensity = 0.0
tint_intensity = 0.0

[lockscreen_widgets]
enabled = false

[nightlight]
enabled = true
temperature_night = 5500

[notification]
offset_y = 20
position = "bottom_center"

[osd]
offset_y = 20
position = "top_center"

[plugins]
enabled = [
  "avivbintangaringga/nix-monitor",
  "noctalia/world_clock",
  "yuuto/calculator",
  "piero-93/thinkpad-fan",
]

[shell]
app_icon_colorize = false
corner_radius_scale = 0.0
font_family = "Iosevka NF"
password_style = "default"
polkit_agent = true
telemetry_enabled = true

[shell.greeter_sync]
auto_sync = true

[shell.launcher]
categories = false
compact = true

[shell.panel]
clipboard_placement = "attached"
clipboard_position = "auto"
launcher_placement = "attached"
launcher_position = "auto"
open_near_click_clipboard = true
open_near_click_control_center = true
open_near_click_session = true
open_near_click_wallpaper = true
polkit_placement = "attached"

[shell.screen_corners]
enabled = false

[system.monitor]
gpu_poll_seconds = 5

[theme]
community_palette = "Breeze"
mode = "auto"
pure_black_dark = false
source = "wallpaper"
wallpaper_scheme = "faithful"

[theme.templates]
builtin_ids = [
  "btop",
  "cava",
  "gtk3",
  "gtk4",
  "ghostty",
  "helix",
  "niri",
  "qt",
  "starship",
]
community_ids = ["pywalfox-beta4", "zed", "papirus-icons", "yazi"]

[wallpaper]
directory = "/home/callisto/cronos-box/Pictures/Wallpapers"
transition_on_startup = true

[wallpaper.default]
path = "/home/callisto/cronos-box/Pictures/Wallpapers/wallhaven-rqjxk7.png"

[widget.bar]
type = "noctalia/world_clock:bar"

[widget.bar_2]
type = "yuuto/calculator:bar"

[widget.battery-graph-widget]
type = "frai3mega/battery-graph:battery-graph-widget"

[widget.nix-monitor]
type = "avivbintangaringga/nix-monitor:nix-monitor"

[widget.widget]
type = "piero-93/thinkpad-fan:widget"

[widget.battery]
display_mode = "graphic"
hide_when_full = true
show_label = false

[widget.brightness]
show_label = false

[widget.clock]
format = "{:%d / %H:%M}"

[widget.cpu]
display = "text"

[widget.network]
show_label = false

[widget.notifications]
hide_when_no_unread = true

[widget.ram]
display = "text"

[widget.volume]
show_label = false

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"

[widget.workspaces]
minimal = true
